<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { font-family: 'Inter', sans-serif; background-color: #f7f8fa; -webkit-tap-highlight-color: transparent; }

</head>
<body class="bg-background text-on-surface min-h-screen pb-16">
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-margin h-touch-target bg-surface shadow-[0px_4px_16px_rgba(0,0,0,0.12)]">
  <button class="flex items-center justify-center w-10 h-10 -ml-2" onclick="openSidebar()">
    <span class="material-symbols-outlined text-primary">menu</span>
  </button>
  <h1 class="font-headline-sm text-headline-sm text-primary flex-1 text-center">Full History</h1>
  <div class="w-10 h-10"></div>
</header>

<div class="fixed inset-0 bg-black/40 z-[90] hidden" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="fixed top-0 left-0 h-full w-72 bg-surface-container-lowest z-[100] shadow-2xl -translate-x-full transition-transform duration-300 flex flex-col" id="sidebar">
  <div class="p-lg border-b border-outline-variant flex items-center gap-sm bg-primary-container text-on-primary">
    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center font-headline-sm text-white" id="sidebar-initials">--</div>
    <div class="overflow-hidden">
      <p class="font-label-md text-label-md text-white truncate" id="sidebar-name">Student</p>
      <p class="font-label-sm text-label-sm text-white/70 truncate" id="sidebar-reg">—</p>
    </div>
    <button class="ml-auto text-white/80 hover:text-white" onclick="closeSidebar()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <nav class="flex-1 p-sm space-y-1 overflow-y-auto">
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="student_dashboard.html">
      <span class="material-symbols-outlined">home</span><span class="font-label-md text-label-md">Home</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="courses.html">
      <span class="material-symbols-outlined">menu_book</span><span class="font-label-md text-label-md">Courses</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="mark_attendance.html">
      <span class="material-symbols-outlined">photo_camera</span><span class="font-label-md text-label-md">Mark Attendance</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="history.html">
      <span class="material-symbols-outlined">history</span><span class="font-label-md text-label-md">History</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="profile.html">
      <span class="material-symbols-outlined">person</span><span class="font-label-md text-label-md">Profile</span>
    </a>
  </nav>
  <div class="p-sm border-t border-outline-variant">
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-error-container transition-colors text-error" href="#" onclick="logout()">
      <span class="material-symbols-outlined">logout</span><span class="font-label-md text-label-md">Logout</span>
    </a>
  </div>
</aside>


<main class="pt-20 px-container-margin max-w-lg mx-auto">
  <div class="flex gap-sm mb-lg overflow-x-auto no-scrollbar pb-1" id="course-filter-row">
    <button class="filter-chip active shrink-0 px-md py-1 rounded-full font-label-sm text-label-sm bg-primary text-on-primary" data-course="all" onclick="setFilter('all', this)">All</button>
  </div>
  <div class="space-y-sm" id="full-log">
    <p class="text-on-surface-variant text-center py-8">Loading history...</p>
  </div>
</main>

<style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
<script>
function openSidebar() {
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.remove('hidden');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.add('hidden');
}


const API = "";
const token = localStorage.getItem('student_token');
if (!token) window.location.href = 'student_login.html';
function logout() { localStorage.clear(); window.location.href = 'index.html'; }

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
let allSessions = [];
let currentFilter = 'all';

function setFilter(courseName, btn) {
  currentFilter = courseName;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.remove('active', 'bg-primary', 'text-on-primary');
    c.classList.add('bg-surface-container', 'text-on-surface-variant');
  });
  btn.classList.add('active', 'bg-primary', 'text-on-primary');
  btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
  render();
}

function render() {
  const logDiv = document.getElementById('full-log');
  const filtered = currentFilter === 'all' ? allSessions : allSessions.filter(s => s.course_name === currentFilter);

  if (filtered.length === 0) {
    logDiv.innerHTML = '<p class="text-on-surface-variant text-center py-8">No sessions in this view yet.</p>';
    return;
  }

  logDiv.innerHTML = filtered.map(s => {
    const d = new Date(s.date);
    const mon = isNaN(d) ? '—' : MONTHS[d.getMonth()];
    const day = isNaN(d) ? '—' : d.getDate();
    const isPresent = s.status === 'Present';
    const badgeClass = isPresent ? "bg-[#88d982]/10 text-[#005312]" : "bg-error/10 text-error";
    return `
    <div class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-transparent hover:border-outline-variant/30 transition-all shadow-sm">
      <div class="flex items-center gap-md">
        <div class="w-12 h-12 rounded-lg bg-surface-container flex flex-col items-center justify-center text-on-surface-variant">
          <span class="font-label-sm text-[10px] leading-tight">${mon}</span>
          <span class="font-headline-sm text-headline-sm leading-tight">${day}</span>
        </div>
        <div>
          <p class="font-label-md text-label-md text-on-surface">${s.course_name}</p>
          <p class="font-label-sm text-label-sm text-outline">${s.course_code || ''}</p>
        </div>
      </div>
      <div class="flex flex-col items-end gap-xs">
        <span class="px-md py-1 ${badgeClass} rounded-full font-label-sm text-label-sm">${s.status}</span>
        <span class="font-label-sm text-[10px] text-outline">${isPresent ? 'Marked at ' + s.time_marked : '—'}</span>
      </div>
    </div>`;
  }).join('');
}

async function load() {
  const res = await fetch(`${API}/students/dashboard`, { headers: { 'Authorization': `Bearer ${token}` } });
  if (res.status === 401) { logout(); return; }
  const data = await res.json();

  document.getElementById('sidebar-name').textContent = data.student_name;
  document.getElementById('sidebar-reg').textContent = data.registration_number;
  document.getElementById('sidebar-initials').textContent = data.student_name.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();

  // Flatten every session across every course into one combined, sorted list
  allSessions = [];
  data.courses.forEach(c => {
    c.sessions.forEach(s => {
      allSessions.push({ ...s, course_name: c.course_name, course_code: c.course_code });
    });
  });
  allSessions.sort((a, b) => new Date(b.date) - new Date(a.date));

  const filterRow = document.getElementById('course-filter-row');
  data.courses.forEach(c => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip shrink-0 px-md py-1 rounded-full font-label-sm text-label-sm bg-surface-container text-on-surface-variant';
    chip.textContent = c.course_name;
    chip.setAttribute('data-course', c.course_name);
    chip.onclick = () => setFilter(c.course_name, chip);
    filterRow.appendChild(chip);
  });

  render();
}
load();
</script>
</body>
</html>
