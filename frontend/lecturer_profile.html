<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { font-family: 'Inter', sans-serif; background-color: #f7f8fa; -webkit-tap-highlight-color: transparent; }

</head>
<body class="bg-background text-on-surface min-h-screen pb-16">
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-margin h-touch-target bg-surface shadow-[0px_4px_16px_rgba(0,0,0,0.12)]">
  <button class="flex items-center justify-center w-10 h-10 -ml-2" onclick="openSidebar()">
    <span class="material-symbols-outlined text-primary">menu</span>
  </button>
  <h1 class="font-headline-sm text-headline-sm text-primary flex-1 text-center">Profile</h1>
  <div class="w-10 h-10"></div>
</header>

<div class="fixed inset-0 bg-black/40 z-[90] hidden" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="fixed top-0 left-0 h-full w-72 bg-surface-container-lowest z-[100] shadow-2xl -translate-x-full transition-transform duration-300 flex flex-col" id="sidebar">
  <div class="p-lg border-b border-outline-variant flex items-center gap-sm" style="background: linear-gradient(135deg, #06104C 0%, #1E2761 100%);">
    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center font-headline-sm text-white" id="sidebar-initials">--</div>
    <div class="overflow-hidden">
      <p class="font-label-md text-label-md text-white truncate" id="sidebar-name">Lecturer</p>
      <p class="font-label-sm text-label-sm text-white/70 truncate">Staff Portal</p>
    </div>
    <button class="ml-auto text-white/80 hover:text-white" onclick="closeSidebar()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <nav class="flex-1 p-sm space-y-1 overflow-y-auto">
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="lecturer_dashboard.html">
      <span class="material-symbols-outlined">home</span><span class="font-label-md text-label-md">Home</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="lecturer_dashboard.html">
      <span class="material-symbols-outlined">menu_book</span><span class="font-label-md text-label-md">Courses & Sessions</span>
    </a>
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-surface-container transition-colors text-on-surface" href="lecturer_profile.html">
      <span class="material-symbols-outlined">person</span><span class="font-label-md text-label-md">Profile</span>
    </a>
  </nav>
  <div class="p-sm border-t border-outline-variant">
    <a class="flex items-center gap-sm px-md py-sm rounded-lg hover:bg-error-container transition-colors text-error" href="#" onclick="logout()">
      <span class="material-symbols-outlined">logout</span><span class="font-label-md text-label-md">Logout</span>
    </a>
  </div>
</aside>


<main class="pt-20 px-container-margin max-w-lg mx-auto">
  <div class="flex flex-col items-center text-center mb-lg">
    <div class="relative">
      <div class="w-24 h-24 rounded-full flex items-center justify-center text-white font-display-lg mb-md overflow-hidden" id="profile-avatar" style="background: linear-gradient(135deg, #06104C 0%, #1E2761 100%);">
        <span id="profile-initials">--</span>
      </div>
      <button class="absolute bottom-2 right-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md active:scale-90 transition-transform" onclick="document.getElementById('photo-input').click()">
        <span class="material-symbols-outlined text-[16px]">photo_camera</span>
      </button>
      <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="uploadPhoto()">
    </div>
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile" id="profile-name">Loading...</h2>
    <span class="mt-xs bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-sm text-label-sm tracking-wider uppercase">Staff Portal</span>
  </div>

  <div id="photo-alert" class="hidden bg-error-container text-on-error-container rounded-lg p-sm font-label-sm text-label-sm mb-md text-center"></div>

  <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant divide-y divide-outline-variant/40">
    <div class="flex items-center gap-md p-md">
      <span class="material-symbols-outlined text-primary">account_balance</span>
      <div>
        <p class="font-label-sm text-label-sm text-on-surface-variant">Institution</p>
        <p class="font-label-md text-label-md">Federal Polytechnic Ado Ekiti</p>
      </div>
    </div>
  </div>

  <button class="w-full mt-lg h-touch-target border-2 border-error text-error rounded-xl font-label-md flex items-center justify-center gap-xs active:scale-95 transition-transform" onclick="logout()">
    <span class="material-symbols-outlined">logout</span>
    Log Out
  </button>
</main>

<script>
function openSidebar() {
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.remove('hidden');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.add('hidden');
}


const API = "";
const token = localStorage.getItem('lecturer_token');
if (!token) window.location.href = 'lecturer_login.html';
function logout() { localStorage.clear(); window.location.href = 'index.html'; }

const name = localStorage.getItem('lecturer_name') || 'Lecturer';
const initials = name.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();
document.getElementById('sidebar-name').textContent = name;
document.getElementById('sidebar-initials').textContent = initials;
document.getElementById('profile-initials').textContent = initials;
document.getElementById('profile-name').textContent = name;

async function loadAvatarInto(elId, endpoint) {
  try {
    const res = await fetch(`${API}${endpoint}`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) return false;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const el = document.getElementById(elId);
    if (el) {
      el.style.backgroundImage = `url(${url})`;
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
    }
    return true;
  } catch (e) { return false; }
}

async function checkPhoto() {
  const ok = await loadAvatarInto('profile-avatar', '/lecturers/photo');
  if (ok) document.getElementById('profile-initials').style.display = 'none';
}

async function uploadPhoto() {
  const input = document.getElementById('photo-input');
  const alertEl = document.getElementById('photo-alert');
  alertEl.classList.add('hidden');
  if (!input.files || !input.files[0]) return;

  const fd = new FormData();
  fd.append('photo', input.files[0]);
  const res = await fetch(`${API}/lecturers/profile-picture`, { method: 'POST', body: fd, headers: { 'Authorization': `Bearer ${token}` } });
  const data = await res.json();
  if (!res.ok) {
    alertEl.textContent = data.detail || 'Could not upload photo.';
    alertEl.classList.remove('hidden');
    return;
  }
  const ok = await loadAvatarInto('profile-avatar', '/lecturers/photo');
  if (ok) document.getElementById('profile-initials').style.display = 'none';
}

checkPhoto();
</script>
</body>
</html>
